name: ✨ 기능 추가
description: 새로운 기능을 구현할 때 사용합니다.
title: "✨ Feat: "
labels: ["feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 📌 작업 목적
      placeholder: 왜 이 기능이 필요한가요? 한 줄로 요약해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] ADR / 명세 본문 초안 작성
        - [ ] 해당 디렉토리 README index 갱신
        - [ ] 관련 docs 와의 cross-link 확인
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 🔗 관련 정보
      placeholder: 관련 ADR / 명세 파일 경로, 이슈 번호 등
    validations:
      required: false
