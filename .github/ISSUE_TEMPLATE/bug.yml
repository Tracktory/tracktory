name: 🐛 버그 수정
description: 발견한 버그를 수정할 때 사용합니다.
title: "🐛 Fix: "
labels: ["fix"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 🔍 문제 상황
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 재현 단계
      value: |
        1.
        2.
        3.
      placeholder: |
        1. docs/api/recommendation.md § 응답 스키마 확인
        2. 실제 서비스 응답과 비교
        3. `next_actions` 필드명이 불일치
    validations:
      required: false

  - type: textarea
    id: fix
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] 원본 문서에서 사실 확인
        - [ ] 본문 수정 + 영향 받는 cross-link 갱신
    validations:
      required: true
