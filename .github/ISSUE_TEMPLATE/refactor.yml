name: ♻️ 리팩토링
description: 코드 정리 또는 구조 개선 시 사용합니다.
title: "♻️ Refactor: "
labels: ["refactor"]
body:
  - type: textarea
    id: refactor-reason
    attributes:
      label: 🤔 리팩토링 이유
      placeholder: ex) docs/architecture/ 에 ADR 과 design doc 이 섞여 있어 entry point 가 모호함
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 📦 리팩토링 범위
      placeholder: ex) docs/architecture/ 폴더 구조 재편
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] 새 폴더 구조로 파일 이동
        - [ ] 영향 받는 cross-link 갱신
        - [ ] 디렉토리 README index 반영
    validations:
      required: true

  - type: textarea
    id: effect
    attributes:
      label: 💥 기대 효과
      placeholder: ex) 문서 종류별 entry point 명확화, 신규 기여자의 탐색 비용 감소
    validations:
      required: false
